# AI Git Commit & PR Generator 설정 파일
# 이 파일은 생성된 커밋 메시지와 PR 템플릿의 형식을 제어합니다.

commit:
  # 커밋 메시지 규칙 (선택 사항)
  prefix_rules:
    - "feat: 새로운 기능 추가"
    - "fix: 버그 수정"
    - "docs: 문서 수정"
    - "style: 코드 포맷팅, 세미콜론 누락, 코드 변경이 없는 경우"
    - "refactor: 코드 리팩토링"
    - "test: 테스트 코드, 리팩토링 테스트 코드 추가"
    - "chore: 빌드 업무 수정, 패키지 매니저 수정"
  
  # 커밋 메시지 형식 요구사항
  format_requirements:
    - "커밋 제목은 50자 이내로 작성할 것"
    - "본문에는 변경된 핵심 내용 1~2개를 불릿 포인트(-)로 요약할 것"
    - "변경된 주요 파일을 1~3개 언급할 것"

pr:
  # PR 본문에 필수적으로 들어가야 할 섹션
  sections:
    - "## Why (변경 배경)"
    - "## What (핵심 변경 사항)"
    - "## How to Test (테스트 방법)"
  
  # PR 템플릿 추가 요구사항
  additional_requirements:
    - "PR 제목은 80자 이내로 작성할 것"
    - "각 섹션(Why, What, How to Test)에는 최소 1개 이상의 불릿 포인트를 포함할 것"
    - "마지막에는 체크리스트 형태의 확인 사항을 1~2개 추가할 것"
