[project]
name = "a1-1-commerce-analysis"
version = "1.1.0"
description = "NumPy/Pandas commerce analysis, image features, signup cohorts and interactive RFM"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "plotly>=6,<7",
]

[dependency-groups]
dev = ["nbclient==0.11.0", "nbformat==5.11.1", "ipykernel==7.4.0"]

[tool.uv]
package = false
