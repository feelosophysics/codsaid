[project]
name = "a3-1-document-scanner"
version = "0.1.0"
description = "비스듬히 찍은 문서를 OpenCV·NumPy 규칙 기반 파이프라인으로 찾아 반듯하게 펴는 A3-1 미션"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "opencv-python>=4.5",
    "numpy>=1.20",
    "matplotlib>=3.3",
    # 보너스 3(PDF 내보내기) 전용. Matplotlib 의존성으로 이미 설치되지만 직접 쓰므로 명시한다.
    "pillow>=8.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "nbclient>=0.10.1",
    "nbformat>=5.10.4",
]
